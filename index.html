<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>@oddh0st</title>
    <link rel="icon" type="image/png" href="images/logo/oddh0stlogo.png">
    <link rel="apple-touch-icon" href="images/logo/oddh0stlogo.png">
    <link rel="preconnect" href="https://api.fontshare.com">
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700,900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0e0e0e;
            font-family: 'Satoshi', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            font-weight: 400;
            -webkit-font-smoothing: antialiased;
            color: #ffffff;
            min-height: 100vh;
        }

        /* ── ARCHIVE SWITCH ── */
        .corner-btn {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 150;
            font-size: 9px;
            font-weight: 500;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: #ffffff;
            text-decoration: none;
            border: 1px solid #ffffff3d;
            padding: 9px 14px;
            background: rgba(14, 14, 14, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: background 0.2s ease, color 0.2s ease;
        }

        .corner-btn:hover { background: #ffffff; color: #0e0e0e; }

        /* ── GALLERY ──
           A cluster, not a ring. Every piece sits along its own fixed angle
           out from dead centre, at the shortest radius that still clears
           every other piece by a set margin — --dx/--dy per item, solved
           once offline against each image's real aspect ratio, pushing a
           piece out along its ray step by step until its box stops touching
           its neighbours. Placed largest piece first, so the flagship claims
           the centre and everything else finds the nearest legal gap around
           it — the tightest packing available, gaps as thin as the margin
           allows, favouring minimal empty space over a strict size-ordered
           ring. A smaller piece can end up nearer the centre than a bigger
           one if that's simply where the nearest free gap was.

           Sizes and positions are both in vmin, the smaller of viewport
           width/height, so the whole cluster — and the gaps between every
           piece — scales as one rigid composition on any screen. Because
           the packing math and the sizing use the same unit, a shape proven
           gap-free at one viewport stays gap-free at every other one; there
           is no separate mobile recalculation. */
        .gallery {
            position: relative;
            width: 100%;
            min-height: 100vh;
        }

        .piece {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy)));
            width: var(--w);
            z-index: var(--z, 1);
            text-decoration: none;
            cursor: default;
        }

        a.piece { cursor: pointer; }

        /* natural aspect ratio: width is set, height is auto, no cropping */
        .piece img,
        .piece video {
            display: block;
            width: 100%;
            height: auto;
            transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .piece:hover img,
        .piece:hover video,
        .piece:focus-visible img,
        .piece:focus-visible video { transform: scale(1.06); }

        /* size tiers, largest to smallest — recency still drives the size */
        .xl { --w: 22vmin; --z: 10; }
        .lg { --w: 18vmin; --z: 8; }
        .md { --w: 15vmin; --z: 6; }
        .sm { --w: 12vmin; --z: 4; }
        .xs { --w: 10vmin; --z: 2; }

        /* ── HOVER CAPTION ──
           One shared label, not ten overlays — it lives on the plain black
           background in the bottom-left corner, so nothing ever sits on top
           of an image. Every piece just points it at their own title, year
           and description on hover; the label doesn't know or care where the
           piece is. Left-anchored rather than centred, so the ragged right
           edge of a description never shifts the title's position as the
           text changes length between pieces. */
        .hover-caption {
            position: fixed;
            left: 40px;
            bottom: 40px;
            z-index: 50;
            max-width: min(340px, 32vw);
            text-align: left;
            transform: translateY(6px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.22s ease, transform 0.22s ease;
        }

        .hover-caption.is-visible {
            opacity: 1;
            transform: translateY(0);
        }

        .hover-caption .t {
            display: block;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: -0.01em;
            line-height: 1.2;
        }

        .hover-caption .y {
            display: block;
            margin-top: 5px;
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: #8f8f8f;
        }

        .hover-caption .d {
            display: block;
            margin-top: 10px;
            font-size: 12px;
            font-weight: 400;
            line-height: 1.5;
            color: #c4c4c4;
        }

        @media (max-width: 900px) {
            .hover-caption {
                left: 18px;
                bottom: 22px;
                max-width: min(300px, 70vw);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .piece img, .piece video, .hover-caption { transition-duration: 0.01ms; }
        }

        /* ── CURSOR DOT ── */
        .cursor-dot {
            position: fixed;
            top: 0;
            left: 0;
            width: 10px;
            height: 10px;
            margin: -5px 0 0 -5px;
            border-radius: 50%;
            background: #ffffff;
            mix-blend-mode: difference;
            pointer-events: none;
            z-index: 999;
            opacity: 0;
            transition: opacity 0.2s ease;
            will-change: transform;
        }

        .cursor-dot.is-visible { opacity: 1; }

        .cursor-glitches {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 998;
        }

        .glitch-char {
            position: absolute;
            top: 0;
            left: 0;
            font-family: 'Courier New', Courier, monospace;
            font-weight: 700;
            font-size: 13px;
            color: #ffffff;
            mix-blend-mode: difference;
            opacity: 0;
            will-change: transform, opacity;
            user-select: none;
        }

        @media (hover: none), (pointer: coarse) {
            .cursor-dot, .cursor-glitches { display: none; }
        }

        @media (prefers-reduced-motion: reduce) {
            .cursor-dot, .cursor-glitches { display: none; }
        }
    </style>
</head>
<body>

    <a class="corner-btn" href="archive.html">Archive</a>

    <main class="gallery">

        <a class="piece xl" href="luminous-festival.html" data-title="Luminous Festival" data-desc="Outdoor forest installation on dual vertical displays. Hand tracking drives an ASCII boid flock as a live force field, hunted by a whale." data-year="2025"
           style="--dx: 0vmin; --dy: 0vmin;">
            <video autoplay muted loop playsinline poster="images/luminous.png">
                <source src="images/luminous.mp4" type="video/mp4">
            </video>
        </a>

        <a class="piece lg" href="cctv-installation.html" data-title="CCTV Installation" data-desc="Networked NDI cameras composited live across the event space. Commissioned by Chantelle Lucyl for Melbourne Fashion Week." data-year="2025"
           style="--dx: 18.2vmin; --dy: -25vmin;">
            <img src="https://img.youtube.com/vi/OBFQhZ5cqq0/maxresdefault.jpg" alt="" loading="lazy">
        </a>

        <a class="piece lg" href="magi-expo-2025.html" data-title="MAGI EXPO 2025" data-desc="Student profiles as asteroids orbiting category planets. React Three Fiber, held at 60fps across devices." data-year="2025"
           style="--dx: 20.4vmin; --dy: -6.6vmin;">
            <img src="images/magiexpo.png" alt="" loading="lazy">
        </a>

        <div class="piece md" data-title="Held, Instantaneously" data-desc="A satirical dating app built on adversarial UX. Swipes spawn NPCs into a Unity terrarium, where matches bond and rejects fade into a graveyard." data-year="2025"
             style="--dx: -18.9vmin; --dy: -3.3vmin;">
            <img src="images/heldinstant.png" alt="" loading="lazy">
        </div>

        <div class="piece md" data-title="MAGI Milk Bar" data-desc="Interactive studio project for MAGI at RMIT." data-year="2025"
             style="--dx: 18.9vmin; --dy: 26.1vmin;">
            <img src="images/milkbar.png" alt="" loading="lazy">
        </div>

        <div class="piece md" data-title="TouchDesigner + Blender" data-desc="Projection mapping and real-time VFX, from TouchDesigner nodes into Blender. Free, hands-on, for anyone who turned up." data-year="2025"
             style="--dx: 0vmin; --dy: 30vmin;">
            <img src="images/workshop.png" alt="" loading="lazy">
        </div>

        <div class="piece sm" data-title="Digital Media Exhibition" data-desc="TikTok-style scroll wired to a Unity camera rig, switching the 3D perspective straight from the browser." data-year="2024"
             style="--dx: -16.9vmin; --dy: 23.3vmin;">
            <img src="images/digitalmedia.png" alt="" loading="lazy">
        </div>

        <div class="piece sm" data-title="N0_R3PLY Collective" data-desc="Ongoing collective work in WebSocket-driven performance art and experimental live environments." data-year="2024"
             style="--dx: -32.8vmin; --dy: 10.7vmin;">
            <img src="images/cadenacam.png" alt="" loading="lazy">
        </div>

        <div class="piece xs" data-title="Major Project" data-desc="Capstone installation for the Bachelor of Digital Media. Dean's Award, 2024." data-year="2023"
             style="--dx: -31.8vmin; --dy: -10.3vmin;">
            <img src="images/neurometrix.png" alt="" loading="lazy">
        </div>

        <div class="piece xs" data-title="SOS2" data-desc="Live performance where networked systems collapse the line between performer and audience." data-year="2023"
             style="--dx: -17vmin; --dy: -23.4vmin;">
            <img src="images/sos2.png" alt="" loading="lazy">
        </div>

    </main>

    <div class="hover-caption" id="hoverCaption" aria-hidden="true">
        <span class="t" id="hoverCaptionTitle"></span>
        <span class="y" id="hoverCaptionYear"></span>
        <span class="d" id="hoverCaptionDesc"></span>
    </div>

    <!-- CURSOR DOT + GLITCH TRAIL -->
    <div class="cursor-dot" id="cursorDot" aria-hidden="true"></div>
    <div class="cursor-glitches" id="cursorGlitches" aria-hidden="true"></div>
    <script>
        // All videos play continuously. The autoplay attribute covers most
        // browsers on its own; this is the fallback for the ones that need
        // an explicit nudge even when muted.
        document.querySelectorAll('.piece video').forEach(v => { v.play().catch(() => {}); });

        // One shared caption instead of per-image overlays, so hovering
        // never covers the piece itself — it just points a label that lives
        // on the black background at whichever piece is under the cursor.
        (function hoverCaption() {
            const caption = document.getElementById('hoverCaption');
            const titleEl = document.getElementById('hoverCaptionTitle');
            const yearEl = document.getElementById('hoverCaptionYear');
            const descEl = document.getElementById('hoverCaptionDesc');
            if (!caption) return;

            document.querySelectorAll('.piece').forEach(p => {
                const show = () => {
                    titleEl.textContent = p.dataset.title || '';
                    yearEl.textContent = p.dataset.year || '';
                    descEl.textContent = p.dataset.desc || '';
                    caption.classList.add('is-visible');
                };
                const hide = () => caption.classList.remove('is-visible');

                p.addEventListener('mouseenter', show);
                p.addEventListener('mouseleave', hide);
                p.addEventListener('focus', show);
                p.addEventListener('blur', hide);
            });
        })();

        (function cursorFX() {
            const dot = document.getElementById('cursorDot');
            const field = document.getElementById('cursorGlitches');
            if (!dot || !field) return;
            if (window.matchMedia('(hover: none), (pointer: coarse)').matches) return;
            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

            const LAG = 0.16;

            let targetX = window.innerWidth / 2;
            let targetY = window.innerHeight / 2;
            let x = targetX;
            let y = targetY;
            let shown = false;
            let raf = null;

            const GLYPHS = '01#%&@$*+=<>/\\|~^'.split('');
            const POOL = 18;
            const SPAWN_PX = 9;
            const MAX_SPAWN_PER_TICK = 2;
            const JITTER = 4;
            const DRIFT_MS = 480;
            const ABSORB_MS = 220;
            const STILL_MS = 90;

            const particles = Array.from({ length: POOL }, () => {
                const el = document.createElement('span');
                el.className = 'glitch-char';
                field.appendChild(el);
                return { el, active: false, state: 'drift', x: 0, y: 0,
                         vx: 0, vy: 0, born: 0, fromX: 0, fromY: 0 };
            });

            let prevX = x, prevY = y;
            let spawnCarry = 0;
            let moving = false;
            let lastMoveAt = 0;
            let nextSlot = 0;

            function spawn(px, py, dx, dy) {
                const p = particles.find(q => !q.active) || particles[nextSlot++ % POOL];
                const ang = Math.atan2(dy, dx) + Math.PI;
                const spread = (Math.random() - 0.5) * 1.4;

                p.active = true;
                p.state = 'drift';
                p.born = performance.now();
                p.x = px + (Math.random() - 0.5) * JITTER * 2;
                p.y = py + (Math.random() - 0.5) * JITTER * 2;
                p.vx = Math.cos(ang + spread) * 0.55;
                p.vy = Math.sin(ang + spread) * 0.55;
                p.el.textContent = GLYPHS[(Math.random() * GLYPHS.length) | 0];
                p.el.style.fontSize = (11 + Math.random() * 4).toFixed(1) + 'px';
            }

            function beginAbsorb(p, now) {
                p.state = 'absorb';
                p.born = now;
                p.fromX = p.x;
                p.fromY = p.y;
            }

            function stepParticles(now) {
                let anyActive = false;

                particles.forEach(p => {
                    if (!p.active) return;
                    anyActive = true;

                    if (p.state === 'drift') {
                        const t = (now - p.born) / DRIFT_MS;
                        if (t >= 1) {
                            p.active = false;
                            p.el.style.opacity = '0';
                            return;
                        }
                        p.x += p.vx;
                        p.y += p.vy;
                        const fade = 1 - t;
                        p.el.style.opacity = (fade * 0.85).toFixed(2);
                        p.el.style.transform =
                            `translate3d(${p.x}px, ${p.y}px, 0) translate(-50%, -50%) scale(${(0.7 + fade * 0.5).toFixed(2)})`;
                    }

                    if (p.state === 'absorb') {
                        const t = Math.min(1, (now - p.born) / ABSORB_MS);
                        const ease = 1 - Math.pow(1 - t, 2);
                        p.x = p.fromX + (x - p.fromX) * ease;
                        p.y = p.fromY + (y - p.fromY) * ease;
                        p.el.style.opacity = (0.85 * (1 - ease)).toFixed(2);
                        p.el.style.transform =
                            `translate3d(${p.x}px, ${p.y}px, 0) translate(-50%, -50%) scale(${(1 - ease * 0.9).toFixed(2)})`;

                        if (t >= 1) { p.active = false; p.el.style.opacity = '0'; }
                    }
                });

                return anyActive;
            }

            function tick() {
                const now = performance.now();

                if (moving && now - lastMoveAt > STILL_MS) {
                    moving = false;
                    particles.forEach(p => { if (p.active && p.state === 'drift') beginAbsorb(p, now); });
                }

                x += (targetX - x) * LAG;
                y += (targetY - y) * LAG;
                dot.style.transform = `translate3d(${x}px, ${y}px, 0)`;

                if (moving) {
                    const dx = x - prevX, dy = y - prevY;
                    const dist = Math.hypot(dx, dy);
                    spawnCarry += dist;
                    let spawned = 0;
                    while (spawnCarry >= SPAWN_PX && spawned < MAX_SPAWN_PER_TICK) {
                        spawn(x, y, dx || 0.01, dy || 0.01);
                        spawnCarry -= SPAWN_PX;
                        spawned++;
                    }
                }
                prevX = x; prevY = y;

                const particlesActive = stepParticles(now);
                const dotSettled = Math.abs(targetX - x) <= 0.05 && Math.abs(targetY - y) <= 0.05;

                if (!dotSettled || particlesActive) {
                    raf = requestAnimationFrame(tick);
                } else {
                    x = targetX; y = targetY;
                    dot.style.transform = `translate3d(${x}px, ${y}px, 0)`;
                    raf = null;
                }
            }

            function wake() { if (!raf) raf = requestAnimationFrame(tick); }

            window.addEventListener('mousemove', e => {
                targetX = e.clientX;
                targetY = e.clientY;
                moving = true;
                lastMoveAt = performance.now();

                if (!shown) {
                    shown = true;
                    x = targetX; y = targetY;
                    prevX = x; prevY = y;
                    dot.classList.add('is-visible');
                }
                wake();
            }, { passive: true });

            document.addEventListener('mouseleave', () => dot.classList.remove('is-visible'));
            document.addEventListener('mouseenter', () => { if (shown) dot.classList.add('is-visible'); });

            window.addEventListener('mousedown', () => dot.style.opacity = '0.5');
            window.addEventListener('mouseup', () => dot.style.opacity = '');
        })();
    </script>

</body>
</html>
